name: the_leak
description: "The Leak: an offline single-phone social deduction party game with Car mode."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_tts: ^4.2.5
  gal: ^3.0.1
  go_router: ^18.1.4
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  assets:
    - assets/decks/words_v1.json
    - assets/copy/captions_v1.json
    - assets/fonts/Anton-OFL.txt
    - assets/fonts/LibreFranklin-OFL.txt
    - assets/fonts/LibreCaslonText-OFL.txt

  fonts:
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
    - family: LibreFranklin
      fonts:
        - asset: assets/fonts/LibreFranklin-VariableFont_wght.ttf
    - family: LibreCaslonText
      fonts:
        - asset: assets/fonts/LibreCaslonText-VariableFont_wght.ttf
        - asset: assets/fonts/LibreCaslonText-Italic-VariableFont_wght.ttf
          style: italic
