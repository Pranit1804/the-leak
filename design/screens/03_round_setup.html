<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Leak — Round setup</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Libre+Caslon+Text:ital@0;1&amp;family=Libre+Franklin:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#F1ECDF}
a{color:#141210}a:hover{color:#C8201A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 44px 20px 24px; background: #F1ECDF; color: #141210; font-family: 'Libre Franklin', sans-serif; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid #141210">
    <button aria-label="Back" style="width: 44px; height: 44px; border: 2px solid #141210; border-radius: 0; background: transparent; color: #141210; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <span style="font-size: 11px; font-weight: 800; letter-spacing: 0.16em">SOUTH TRIP</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-family: Anton, sans-serif; font-size: 48px; line-height: 1; font-weight: 400">ROUND 13</h1>
    <p style="margin: 0; font-family: 'Libre Caslon Text', serif; font-style: italic; font-size: 17px">Priya is the Master this round.</p>
  </div>

  <div style="padding: 14px 0; border-top: 3px solid #141210; border-bottom: 1px solid #141210; display: flex; align-items: center; gap: 14px">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px">
      <span style="font-size: 17px; font-weight: 700">Car mode</span>
      <span style="font-size: 14px; color: #4F493E">The driver plays without the screen</span>
    </div>
    <button aria-label="Car mode" aria-pressed="true" style="width: 60px; height: 32px; border: 2px solid #141210; border-radius: 0; background: #141210; padding: 2px; display: flex; justify-content: flex-end">
      <span aria-hidden="true" style="display: block; width: 24px; height: 24px; background: #F1ECDF"></span>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 11px; font-weight: 800; letter-spacing: 0.16em">WHO'S DRIVING NOW?</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button aria-pressed="true" style="height: 50px; border: 2px solid #141210; border-radius: 0; background: #141210; color: #FFFFFF; font-family: 'Libre Franklin', sans-serif; font-size: 16px; font-weight: 700">Rohan</button>
      <button aria-pressed="false" style="height: 50px; border: 2px solid #141210; border-radius: 0; background: transparent; color: #141210; font-family: 'Libre Franklin', sans-serif; font-size: 16px; font-weight: 600">Amit</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 11px; font-weight: 800; letter-spacing: 0.16em">DIFFICULTY</span>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 2px solid #141210">
      <button aria-pressed="false" style="height: 46px; border: none; border-right: 2px solid #141210; border-radius: 0; background: transparent; color: #141210; font-family: 'Libre Franklin', sans-serif; font-size: 14px; font-weight: 600">Easy</button>
      <button aria-pressed="true" style="height: 46px; border: none; border-right: 2px solid #141210; border-radius: 0; background: #141210; color: #FFFFFF; font-family: 'Libre Franklin', sans-serif; font-size: 14px; font-weight: 700">Medium</button>
      <button aria-pressed="false" style="height: 46px; border: none; border-right: 2px solid #141210; border-radius: 0; background: transparent; color: #141210; font-family: 'Libre Franklin', sans-serif; font-size: 14px; font-weight: 600">Hard</button>
      <button aria-pressed="false" style="height: 46px; border: none; border-radius: 0; background: transparent; color: #141210; font-family: 'Libre Franklin', sans-serif; font-size: 14px; font-weight: 600">Mixed</button>
    </div>
  </div>

  <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #4F493E"><span style="font-size: 11px; font-weight: 800; letter-spacing: 0.16em; color: #C8201A">NOTE </span>5 passengers get roles. Rohan is driving, so he plays as a Common.</p>

  <a href="#" style="margin-top: auto; height: 56px; background: #141210; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: Anton, sans-serif; font-size: 21px; letter-spacing: 0.08em; text-decoration: none">START ROUND</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
